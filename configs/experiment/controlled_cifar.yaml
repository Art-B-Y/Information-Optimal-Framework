_target_: its.experiments.controlled_cifar.build_controlled_cifar_experiment
device: ${device}
model:
  in_channels: 3
  # base_channels=64 trains from scratch (default, lower memory/compute).
  # IMPORTANT: set to 128 when loading score_epoch_0050.pt as backbone —
  # that checkpoint uses base_channels=128 and will fail with 64.
  base_channels: 64
  channel_mults: [1, 2, 2, 4]
control:
  # Flattened image size for 32x32x3 CIFAR-10
  state_dim: 3072
  hidden_dim: 256
  depth: 3
  time_embedding_dim: 16
sde:
  beta_min: 0.1
  beta_max: 10.0
  num_steps: 100
  clamp: 5.0
  control_weight: 1.0
  sigma_min: 0.01
  sigma_max: 1.0
  corrector_steps: 1
  corrector_step_size: 0.01
  jarzynski_clip: 50.0
  jarzynski_subsample: 2
training:
  epochs: 5
  batch_size: 64
  dataset_name: cifar10
  control_weight: 5.0e-3
  log_interval: 100
  # path_kl_weight > 0 is required for the Girsanov path-KL term to influence training.
  # Raised from 0.0 to 0.1 (Bug 5 fix, Session 1).
  path_kl_weight: 0.1
  # quality_weight > 0 enables feature-matching loss via frozen Inception-v3 (Session 3).
  quality_weight: 0.01
  wandb: false
  checkpoint_dir: checkpoints/controlled_cifar
  save_interval: 1
  log_dir: logs
  run_name: controlled_cifar
  mixed_precision: true
  grad_accum_steps: 1
  eval_every: 0
  eval_num_samples: 256
  eval_batch_size: 64
  eval_baselines: []
  # Training stability additions (Session 3, audit fix CAT4-2):
  nan_tolerance: 5
  save_every_n_epochs: null
  jsonl_log: null
  # Pretrained score backbone + freeze flag (Step 3B, Session 4).
  # Set score_backbone_ckpt to a checkpoint path to load a pretrained score model.
  # Set freeze_score_model: true to train only the control policy.
  score_backbone_ckpt: null
  freeze_score_model: false
  # Subset size for fast sweep pilots (0 = full dataset). Session 4 audit CAT5.
  dataset_subset_size: 0
  # Early stopping patience in epochs (0 = disabled). Session 5 Step 2B.
  early_stop_patience: 0
  early_stop_min_delta: 0.01
  # LR scheduling (Step 7A, Session 6)
  use_lr_schedule: true
  lr_min: 1.0e-6
  # Sample diversity logging (Step 7C, Session 6)
  log_sample_diversity: false
