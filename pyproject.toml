[project]
name = "its-beta"
version = "0.1.0"
description = "Information Track Sampler (ITS) beta-phase research sandbox"
authors = [{ name = "ITS Research" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2.0",
  "jax>=0.4.28,<0.5",
  "jaxlib>=0.4.28,<0.5",
  "diffrax>=0.5.0,<0.6",
  "torch>=2.2,<2.4",
  "torchvision>=0.17,<0.19",
  "torchmetrics>=1.3,<1.5",
  "einops>=0.7,<0.8",
  "scipy>=1.11,<1.14",
  "tqdm>=4.66,<5",
  "typer[all]>=0.9,<0.13",
  "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3,<2.4",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=4.1,<5",
  "hypothesis>=6.100,<7",
  "ruff>=0.5,<0.7",
  "mypy>=1.8,<1.11",
  "pre-commit>=3.7,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
